name: Radar de Voos

on:
  schedule:
    - cron: "0 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Executar Radar de Voos
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: python3 monitor.py

      - name: Salvar resultados
        run: |
          git config user.name "radar-voos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/latest.json docs/latest.json
          git diff --cached --quiet || git commit -m "Atualiza radar de voos"
          git push
